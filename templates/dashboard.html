<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Hub</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- ── Top Bar ─────────────────────────────────────────────────── -->
  <header id="topbar">
    <div class="topbar-left">
      <button id="sidebar-toggle" class="icon-btn" title="Toggle sidebar">&#9776;</button>
      <h1 class="logo">Account<span>Hub</span></h1>
    </div>
    <div class="topbar-center">
      <div id="alert-banner" class="alert-banner hidden"></div>
    </div>
    <div class="topbar-right">
      <span id="last-sync" class="sync-label"></span>
      <div class="sync-actions">
        <button onclick="syncEmail()" class="btn btn-sm" title="Sync emails">&#9993; Email</button>
        <button onclick="syncNotes()" class="btn btn-sm" title="Sync notes">&#128221; Notes</button>
        <button onclick="syncSalesforce()" class="btn btn-sm" title="Sync Salesforce">&#9729; SF</button>
      </div>
    </div>
  </header>

  <div id="app-shell">
    <!-- ── Sidebar ─────────────────────────────────────────────── -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <input type="text" id="account-search" placeholder="Search accounts..." autocomplete="off">
        <button id="btn-add-account" class="btn btn-primary btn-sm" title="Add account">+ New</button>
      </div>
      <nav id="account-list" class="account-list"></nav>
    </aside>

    <!-- ── Main Content ────────────────────────────────────────── -->
    <main id="main">
      <!-- Dashboard Overview (default view) -->
      <section id="view-dashboard" class="view active">
        <div class="view-header">
          <h2>Dashboard</h2>
        </div>
        <div id="kpi-row" class="kpi-row"></div>
        <div class="grid-2">
          <div class="card" id="alerts-card">
            <div class="card-header">
              <h3>Alerts</h3>
              <span id="alert-count" class="badge">0</span>
            </div>
            <div id="alerts-list" class="card-body scrollable"></div>
          </div>
          <div class="card" id="unmatched-card">
            <div class="card-header">
              <h3>Unmatched Accounts</h3>
              <span id="unmatched-count" class="badge">0</span>
            </div>
            <div id="unmatched-list" class="card-body scrollable"></div>
          </div>
        </div>
        <div class="card" id="top-accounts-card">
          <div class="card-header"><h3>Top Accounts (30-Day Revenue)</h3></div>
          <div id="top-accounts-table" class="card-body"></div>
        </div>
      </section>

      <!-- Account Detail View -->
      <section id="view-account" class="view">
        <div class="view-header">
          <button onclick="showDashboard()" class="btn btn-ghost">&larr; Dashboard</button>
          <div>
            <h2 id="acct-name"></h2>
            <span id="acct-system" class="subtitle"></span>
          </div>
          <div class="acct-meta">
            <span id="acct-territory" class="tag"></span>
            <span id="acct-location" class="subtitle"></span>
          </div>
        </div>

        <!-- Account Tabs -->
        <div class="tabs">
          <button class="tab active" data-tab="tab-overview">Overview</button>
          <button class="tab" data-tab="tab-sales">Sales</button>
          <button class="tab" data-tab="tab-contacts">Contacts</button>
          <button class="tab" data-tab="tab-notes">Notes</button>
        </div>

        <!-- Overview Tab -->
        <div id="tab-overview" class="tab-panel active">
          <div id="acct-kpi-row" class="kpi-row"></div>
          <div class="card">
            <div class="card-header"><h3>Revenue Targets</h3></div>
            <div id="acct-targets" class="card-body"></div>
          </div>
          <div class="card">
            <div class="card-header"><h3>Recent Orders</h3></div>
            <div id="acct-recent-orders" class="card-body"></div>
          </div>
        </div>

        <!-- Sales Tab -->
        <div id="tab-sales" class="tab-panel">
          <div class="card">
            <div class="card-header">
              <h3>Product Sales Summary</h3>
              <select id="sales-days" onchange="reloadAccountDetail()">
                <option value="30">Last 30 days</option>
                <option value="90" selected>Last 90 days</option>
                <option value="180">Last 180 days</option>
                <option value="365">Last year</option>
              </select>
            </div>
            <div id="acct-sales-table" class="card-body"></div>
          </div>
        </div>

        <!-- Contacts Tab -->
        <div id="tab-contacts" class="tab-panel">
          <div class="card">
            <div class="card-header">
              <h3>Contacts</h3>
              <button onclick="showAddContact()" class="btn btn-primary btn-sm">+ Add Contact</button>
            </div>
            <div id="acct-contacts" class="card-body"></div>
          </div>
        </div>

        <!-- Notes Tab -->
        <div id="tab-notes" class="tab-panel">
          <div class="card">
            <div class="card-header">
              <h3>Notes</h3>
              <button onclick="showAddNote()" class="btn btn-primary btn-sm">+ Add Note</button>
            </div>
            <div id="acct-notes" class="card-body"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- ── Modal ─────────────────────────────────────────────────── -->
  <div id="modal-overlay" class="modal-overlay hidden" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button onclick="closeModal()" class="icon-btn">&times;</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- ── Toast ─────────────────────────────────────────────────── -->
  <div id="toast-container" class="toast-container"></div>

  <script src="/static/app.js"></script>
</body>
</html>
